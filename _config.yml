# Jekyll configuration

title: EDGCPP
url: https://edgcpp.org # the base hostname & protocol for the site
description: >-
  The edgcpp.org open-source project website.

# Project links used throughout the site.
github_url: https://github.com/edgcpp
repo_url: https://github.com/edgcpp/edgcpp.github.io
alliance_url: https://cppalliance.org
slack_url: https://cppalliance.org/slack/

# Build settings
markdown: kramdown

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - local
  - README.md
  - CLAUDE.md
  - AGENTS.md

# Keep the Sphinx output directories that the compiler documentation build
# copies into doc/ (Jekyll skips names that start with an underscore).
include:
  - _static
  - _sources
  - _images
