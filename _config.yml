# Jekyll configuration

title: EDGCPP
url: https://edgcpp.org # the base hostname & protocol for the site
description: >-
  The edgcpp.org open-source project website.

# Project links used throughout the site.
github_url: https://github.com/edgcpp
repo_url: https://github.com/edgcpp/edgcpp.github.io
alliance_url: https://cppalliance.org

# Build settings
markdown: kramdown

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - local
  - README.md
  - CLAUDE.md
  - AGENTS.md
